# Nixpacks configuration for Railway deployment
# This is a Python-only project. The frontend is pre-built locally
# and committed to backend/static — no Node.js build happens on Railway.

[phases.setup]
nixPkgs = ["python311", "gcc", "gfortran", "libffi", "openssl"]

[phases.install]
cmds = [
  "python3 -m pip install --no-cache-dir --upgrade pip",
  "pip install --no-cache-dir -r backend/requirements.txt"
]

[start]
cmd = "cd backend && python init_db.py && gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
