# Nixpacks configuration for Railway deployment
# Python-only project. Frontend is pre-built locally and committed
# to backend/static — no Node.js build happens on Railway.
# NOTE: do NOT add gcc/gfortran — they collide in the Nix env.
# Nix python3 does NOT bundle pip — must add python311Packages.pip.

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "pip install --no-cache-dir -r backend/requirements.txt"
]

[start]
cmd = "cd backend && python init_db.py && gunicorn app.main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
